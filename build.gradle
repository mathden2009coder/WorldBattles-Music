plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
group = 'com.worldbattles'
version = '1.0.1'
base { archivesName = 'worldbattles-music' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { worldbattlesmusic { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.2.0' }
jar {
    manifest {
        attributes([
            'Specification-Title': 'worldbattlesmusic',
            'Specification-Vendor': 'WorldBattles',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': 'WorldBattles'
        ])
    }
}
jar.finalizedBy('reobfJar')
